    sdk: flutter

  cupertino_icons: ^1.0.8
  uuid: ^4.4.0
  flutter_riverpod: ^2.6.1

  drift: ^2.17.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

